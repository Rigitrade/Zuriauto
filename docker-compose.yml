# Local Postgres for development and the integration tests.
#
# Modelled on the earlier project at D:\Personal\zuriauto, but deliberately NOT
# identical to it. That project's container is also called `zuriauto-db`, also
# binds host port 5433, and its volume still holds its v1 schema — a Car,
# Customer and Rental table of a different shape from this one. Reusing any of
# the three would have meant either a name conflict or this project's
# migrations landing on top of that project's data.
#
# So: its own container, its own volume, and port 5434. Both projects can run
# at once, and neither can corrupt the other.
services:
  db:
    # Matches the production Neon project. Neon defaults new projects to 18,
    # and the local version has to agree with it: the database tests are the
    # only place the migrations and the concurrency behaviour are exercised, so
    # testing against a different major than production runs would defeat them.
    #
    # Changing this major version needs the volume deleted — a Postgres data
    # directory is not readable by a different major. Nothing of value lives
    # here; the test harness truncates every table between tests anyway.
    image: postgres:18
    container_name: zuriauto-site-db
    environment:
      POSTGRES_USER: zuriauto
      POSTGRES_PASSWORD: zuriauto
      POSTGRES_DB: zuriauto
    ports:
      - '5434:5432'
    volumes:
      # `/var/lib/postgresql`, not `/var/lib/postgresql/data`. The 18 images
      # store data in major-version-specific subdirectories, and refuse to
      # start if they find a cluster at the old path — so a volume written by
      # the 16 image cannot simply be remounted. It was deleted rather than
      # pg_upgrade'd; this is a development database.
      - zuriauto-site-pgdata:/var/lib/postgresql
    # So `docker compose up -d db` can be followed straight away by a migration
    # rather than by a guess about whether the server is accepting connections.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zuriauto -d zuriauto']
      interval: 2s
      timeout: 3s
      retries: 15

  # Development mail catcher. Accepts SMTP on 1025 and shows what would
  # have been sent at http://localhost:8025 — nothing leaves the machine.
  #
  # This exists because MAIL_OFFICE in .env.local is the real office
  # address. Creating a rental locally and triggering the cron would
  # otherwise email the real office address for real.
  #
  # Not part of `pnpm db:up`, which names the db service explicitly.
  # Start it with `pnpm mail:up`.
  mail:
    image: axllent/mailpit:latest
    container_name: zuriauto-site-mail
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  zuriauto-site-pgdata:
